
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050510">
<title>NEON SNAKE</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#050510;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:20px 12px}
h1{color:#00ff9c;text-shadow:0 0 18px #00ff9c;font-size:clamp(30px,8vw,46px);direction:ltr;margin:8px}
p{color:#a6b5d0}
.stats{display:flex;justify-content:center;gap:12px;margin:18px auto}
.stats div{background:#10182a;border:1px solid #00ff9c66;border-radius:12px;padding:10px;min-width:90px}
strong{display:block;color:#00ff9c;font-size:23px}
.arena{position:relative;width:min(94vw,480px);margin:auto;border:2px solid #00ff9c;border-radius:12px;overflow:hidden;box-shadow:0 0 22px #00ff9c44}
canvas{display:block;width:100%;height:auto;touch-action:none}
#message{margin:15px}
button{background:#0d2920;color:#00ff9c;border:1px solid #00ff9c;border-radius:12px;padding:13px 20px;font-size:17px;font-weight:bold;touch-action:manipulation}
.controls{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin:18px}
.controls button{height:55px;padding:0;font-size:24px}
.empty{visibility:hidden}
</style>
</head>
<body>
<h1>NEON SNAKE</h1>
<p>CYBER ARCADE • لعبة الثعبان</p>
<div class="stats">
<div>النقاط<strong id="score">0</strong></div>
<div>أفضل نتيجة<strong id="best">0</strong></div>
</div>
<div class="arena">
<canvas id="game" width="480" height="480"></canvas>
</div>
<p id="message">اضغط ابدأ اللعب للانطلاق!</p>
<button id="start">ابدأ اللعب</button>
<div class="controls">
<span class="empty"></span><button data-d="0,-1">▲</button><span class="empty"></span>
<button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button>
</div>
<p>التحكم بالأسهم أو WASD أو أزرار اللمس. اجمع الطعام وتجنب الاصطدام!</p>
<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d');
const n=24,s=20;
let snake,food,dir,next,score,timer,playing=false;
let best=0;
try{best=Number(localStorage.getItem('neon-best'))||0}catch(e){}
const $=id=>document.getElementById(id);
$('best').textContent=best;
function placeFood(){
 do{food={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}}
 while(snake.some(p=>p.x===food.x&&p.y===food.y));
}
function draw(){
 x.fillStyle='#070b18';x.fillRect(0,0,480,480);
 x.strokeStyle='#15223a';
 for(let i=0;i<=n;i++){
 x.beginPath();x.moveTo(i*s,0);x.lineTo(i*s,480);x.stroke();
 x.beginPath();x.moveTo(0,i*s);x.lineTo(480,i*s);x.stroke();
 }
 x.save();x.shadowColor='#ff00e5';x.shadowBlur=20;x.fillStyle='#ff00e5';
 x.beginPath();x.arc(food.x*s+10,food.y*s+10,7,0,Math.PI*2);x.fill();x.restore();
 snake.forEach((p,i)=>{
 x.save();x.fillStyle=i?'#00ff9c':'#cafff0';x.shadowColor='#00ff9c';x.shadowBlur=12;
 x.beginPath();x.roundRect(p.x*s+2,p.y*s+2,16,16,5);x.fill();x.restore();
 });
}
function finish(){
 playing=false;clearInterval(timer);
 $('message').textContent='انتهت اللعبة! نتيجتك: '+score;
 $('start').textContent='العب مرة أخرى';
}
function step(){
 dir=next;
 const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 const eat=h.x===food.x&&h.y===food.y;
 const body=eat?snake:snake.slice(0,-1);
 if(h.x<0||h.x>=n||h.y<0||h.y>=n||body.some(p=>p.x===h.x&&p.y===h.y)){finish();return}
 snake.unshift(h);
 if(eat){
 score+=10;$('score').textContent=score;
 if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('neon-best',best)}catch(e){}}
 placeFood();clearInterval(timer);timer=setInterval(step,Math.max(65,140-Math.floor(score/50)*10));
 }else snake.pop();
 draw();
}
function turn(dx,dy){if(dx===-dir.x&&dy===-dir.y)return;next={x:dx,y:dy}}
function start(){
 clearInterval(timer);score=0;$('score').textContent=0;
 snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];
 dir={x:1,y:0};next={x:1,y:0};playing=true;
 placeFood();$('message').textContent='اجمع الطعام الوردي!';$('start').textContent='إعادة اللعب';
 draw();timer=setInterval(step,140);
}
$('start').onclick=start;
document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{
 const [dx,dy]=b.dataset.d.split(',').map(Number);turn(dx,dy);
}));
document.addEventListener('keydown',e=>{
 const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
 if(m[e.key]){e.preventDefault();turn(...m[e.key])}
});
let touch=null;
c.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY}});
c.addEventListener('pointerup',e=>{
 if(!touch)return;
 const dx=e.clientX-touch.x,dy=e.clientY-touch.y;
 if(Math.max(Math.abs(dx),Math.abs(dy))>20){
 if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);
 else turn(0,dy>0?1:-1);
 }
 touch=null;
});
snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];dir={x:1,y:0};food={x:16,y:12};draw();
})();
</script>
</body>
</html>

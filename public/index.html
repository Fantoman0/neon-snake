
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050510">
<title>NEON SNAKE</title>
<style>
:root {
  --bg: #050510;
  --panel: #10182a;
  --green: #00ff9c;
  --pink: #ff00e5;
  --text: #f5f7ff;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding: max(12px, env(safe-area-inset-top)) 12px
           max(16px, env(safe-area-inset-bottom));
  background: radial-gradient(ellipse at top, #10182a, var(--bg) 65%);
  color: var(--text);
  font-family: system-ui, sans-serif;
  text-align: center;
  overscroll-behavior: none;
}
h1 {
  margin: 8px 0;
  color: var(--green);
  font-size: clamp(30px, 8vw, 46px);
  text-shadow: 0 0 18px #00ff9c99;
  direction: ltr;
}
p { color: #a6b5d0; }
.stats {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 16px auto;
}
.stats div {
  min-width: 100px;
  padding: 8px 14px;
  background: var(--panel);
  border: 1px solid #00ff9c66;
  border-radius: 12px;
}
strong {
  display: block;
  color: var(--green);
  font-size: 23px;
}
.arena {
  width: min(94vw, 480px, 58dvh);
  width: min(94vw, 480px);
  margin: auto;
  overflow: hidden;
  border: 2px solid var(--green);
  border-radius: 12px;
  box-shadow: 0 0 22px #00ff9c44;
  line-height: 0;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  touch-action: none;
}
#message { min-height: 26px; margin: 14px 0; }
button {
  min-height: 48px;
  padding: 10px 18px;
  border: 1px solid var(--green);
  border-radius: 12px;
  background: #0d2920;
  color: var(--green);
  font-size: 17px;
  font-weight: 700;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button:active {
  background: #14513c;
  transform: scale(.97);
}
.controls {
  display: grid;
  grid-template-columns: repeat(3, minmax(54px, 68px));
  gap: 8px;
  justify-content: center;
  margin: 16px auto;
  direction: ltr;
}
.controls button {
  height: 56px;
  padding: 0;
  font-size: 25px;
}
.empty { visibility: hidden; }
.note { max-width: 480px; margin: 12px auto; font-size: 13px; }
@media (max-height: 650px) {
  body { padding-top: 5px; }
  h1 { font-size: 28px; margin: 3px; }
  .stats { margin: 8px auto; }
  .arena { width: min(72vw, 360px); }
  #message { margin: 7px 0; }
  .controls { margin: 8px auto; gap: 5px; }
  .controls button { height: 44px; }
}
</style>
</head>
<body>
<h1>NEON SNAKE</h1>
<p>CYBER ARCADE • لعبة الثعبان</p>

<div class="stats">
  <div>النقاط<strong id="score">0</strong></div>
  <div>أفضل نتيجة<strong id="best">0</strong></div>
</div>

<div class="arena">
  <canvas id="game" width="480" height="480"></canvas>
</div>

<p id="message" aria-live="polite">اضغط «ابدأ اللعب» للانطلاق!</p>
<button id="start">ابدأ اللعب</button>

<div class="controls" aria-label="أزرار التحكم">
  <span class="empty"></span>
  <button type="button" data-d="0,-1" aria-label="أعلى">▲</button>
  <span class="empty"></span>
  <button type="button" data-d="-1,0" aria-label="يسار">◀</button>
  <button type="button" data-d="0,1" aria-label="أسفل">▼</button>
  <button type="button" data-d="1,0" aria-label="يمين">▶</button>
</div>

<p class="note">تحكم بالأسهم أو WASD أو أزرار اللمس أو السحب على ساحة اللعب. اجمع الطعام الوردي وتجنب الاصطدام!</p>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const SIZE = 480;
  const CELLS = 24;
  const CELL = SIZE / CELLS;
  const $ = id => document.getElementById(id);

  let snake = [];
  let food = { x: 16, y: 12 };
  let dir = { x: 1, y: 0 };
  let next = { x: 1, y: 0 };
  let score = 0;
  let best = 0;
  let timer = null;
  let playing = false;
  let touch = null;

  try {
    best = Number(localStorage.getItem("neon-best")) || 0;
  } catch (_) {}
  $("best").textContent = best;

  function placeFood() {
    const free = [];
    for (let y = 0; y < CELLS; y++) {
      for (let x = 0; x < CELLS; x++) {
        if (!snake.some(p => p.x === x && p.y === y)) {
          free.push({ x, y });
        }
      }
    }
    if (!free.length) {
      playing = false;
      clearInterval(timer);
      $("message").textContent = "مذهل! فزت بملء الساحة!";
      $("start").textContent = "العب مرة أخرى";
      return;
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function draw() {
    ctx.fillStyle = "#070b18";
    ctx.fillRect(0, 0, SIZE, SIZE);

    ctx.strokeStyle = "#15223a";
    ctx.lineWidth = 1;
    for (let i = 0; i <= CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, SIZE);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(SIZE, i * CELL);
      ctx.stroke();
    }

    ctx.save();
    ctx.shadowColor = "#ff00e5";
    ctx.shadowBlur = 20;
    ctx.fillStyle = "#ff00e5";
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    snake.forEach((p, i) => {
      ctx.save();
      ctx.fillStyle = i === 0 ? "#cafff0" : "#00ff9c";
      ctx.shadowColor = "#00ff9c";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.roundRect(p.x * CELL + 2, p.y * CELL + 2, CELL - 4, CELL - 4, 5);
      ctx.fill();
      ctx.restore();
    });
  }

  function finish(message) {
    playing = false;
    clearInterval(timer);
    $("message").textContent = message || ("انتهت اللعبة! نتيجتك: " + score);
    $("start").textContent = "العب مرة أخرى";
  }

  function step() {
    dir = { ...next };
    const head = {
      x: snake[0].x + dir.x,
      y: snake[0].y + dir.y
    };
    const eat = head.x === food.x && head.y === food.y;
    const body = eat ? snake : snake.slice(0, -1);

    if (
      head.x < 0 || head.x >= CELLS ||
      head.y < 0 || head.y >= CELLS ||
      body.some(p => p.x === head.x && p.y === head.y)
    ) {
      finish();
      return;
    }

    snake.unshift(head);

    if (eat) {
      score += 10;
      $("score").textContent = score;

      if (score > best) {
        best = score;
        $("best").textContent = best;
        try { localStorage.setItem("neon-best", String(best)); } catch (_) {}
      }

      placeFood();
      if (!playing) {
        draw();
        return;
      }

      clearInterval(timer);
      timer = setInterval(step, Math.max(65, 140 - Math.floor(score / 50) * 10));
    } else {
      snake.pop();
    }
    draw();
  }

  function turn(dx, dy) {
    if (!playing) return;
    if (dx === -dir.x && dy === -dir.y) return;
    next = { x: dx, y: dy };
  }

  function start() {
    clearInterval(timer);
    score = 0;
    $("score").textContent = "0";
    snake = [
      { x: 8, y: 12 },
      { x: 7, y: 12 },
      { x: 6, y: 12 }
    ];
    dir = { x: 1, y: 0 };
    next = { x: 1, y: 0 };
    playing = true;
    placeFood();
    $("message").textContent = "اجمع الطعام الوردي!";
    $("start").textContent = "إعادة اللعب";
    draw();
    timer = setInterval(step, 140);
  }

  $("start").addEventListener("click", start);

  document.querySelectorAll("[data-d]").forEach(button => {
    button.addEventListener("click", () => {
      const [dx, dy] = button.dataset.d.split(",").map(Number);
      turn(dx, dy);
    });
  });

  document.addEventListener("keydown", event => {
    const keys = {
      ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
      ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
      ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
      ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
    };
    const move = keys[event.key];
    if (move) {
      event.preventDefault();
      turn(move[0], move[1]);
    }
  });

  canvas.addEventListener("pointerdown", event => {
    touch = { x: event.clientX, y: event.clientY };
  });

  canvas.addEventListener("pointerup", event => {
    if (!touch) return;
    const dx = event.clientX - touch.x;
    const dy = event.clientY - touch.y;

    if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
      if (Math.abs(dx) > Math.abs(dy)) {
        turn(dx > 0 ? 1 : -1, 0);
      } else {
        turn(0, dy > 0 ? 1 : -1);
      }
    }
    touch = null;
  });

  canvas.addEventListener("pointercancel", () => { touch = null; });

  snake = [
    { x: 8, y: 12 },
    { x: 7, y: 12 },
    { x: 6, y: 12 }
  ];
  draw();
})();
</script>
</body>
</html>
